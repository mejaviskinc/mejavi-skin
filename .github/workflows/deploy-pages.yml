name: Deploy Mejavi Skin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate website
        run: |
          node scripts/validate-site.mjs
          node --check site/script.js
          node --check site/store.js
          node --check site/discount-sync.js
          node --check site/tracking.js
          node --check site/javi.js
          node --check site/site-content.js
          node --check site/home-products.js
          node --check site/admin.js
          node --check presentasi/presentation-enhancements.js

      - name: Include presentation site
        shell: bash
        run: |
          rm -rf site/presentasi
          mkdir -p site/presentasi
          cp -R presentasi/. site/presentasi/
          if ! grep -q 'product-photos.css' site/presentasi/index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="product-photos.css">\n</head>#' site/presentasi/index.html
          fi

      - name: Bust browser cache for website assets
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::12}"
          while IFS= read -r -d '' file; do
            sed -E -i "s#site-content\.js(\?v=[A-Za-z0-9._-]+)?#site-content.js?v=${VERSION}#g" "$file"
            sed -E -i "s#script\.js(\?v=[A-Za-z0-9._-]+)?#script.js?v=${VERSION}#g" "$file"
            sed -E -i "s#store\.js(\?v=[A-Za-z0-9._-]+)?#store.js?v=${VERSION}#g" "$file"
            sed -E -i "s#discount-sync\.js(\?v=[A-Za-z0-9._-]+)?#discount-sync.js?v=${VERSION}#g" "$file"
            sed -E -i "s#style\.css(\?v=[A-Za-z0-9._-]+)?#style.css?v=${VERSION}#g" "$file"
          done < <(find site -type f -name '*.html' -print0)

          # Homepage-only compact product cards + public 1-5 star ratings.
          if ! grep -q 'home-products.js' site/index.html; then
            sed -i "s#</body>#  <script src=\"home-products.js?v=${VERSION}\"></script>\n</body>#" site/index.html
          else
            sed -E -i "s#home-products\.js(\?v=[A-Za-z0-9._-]+)?#home-products.js?v=${VERSION}#g" site/index.html
          fi

          # Presentation-only richer copy + click-to-fullscreen video with sound.
          if ! grep -q 'presentation-enhancements.js' site/presentasi/index.html; then
            sed -i "s#</body>#  <script src=\"presentation-enhancements.js?v=${VERSION}\"></script>\n</body>#" site/presentasi/index.html
          else
            sed -E -i "s#presentation-enhancements\.js(\?v=[A-Za-z0-9._-]+)?#presentation-enhancements.js?v=${VERSION}#g" site/presentasi/index.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

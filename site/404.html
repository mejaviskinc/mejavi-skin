<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://mejaviskincare.co.id/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
  <link rel="icon" href="https://mejaviskincare.co.id/favicon.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="https://mejaviskincare.co.id/apple-touch-icon.png" sizes="180x180">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mejavi Skin+ — Mengarahkan…</title>
  <meta name="robots" content="noindex">
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ec;color:#171717}
    main{max-width:560px;padding:32px;text-align:center}
    a{color:inherit}
  </style>
</head>
<body>
  <main>
    <h1>Mejavi Skin+</h1>
    <p id="message">Sedang mengarahkan ke halaman yang benar…</p>
    <p><a href="index.html">Kembali ke Beranda</a></p>
  </main>
  <script>
    (function(){
      var routes={
        "":"index.html","about":"about.html","products":"products.html","ingredients":"ingredients.html",
        "video":"video.html","reviews":"reviews.html","collaboration":"collaboration.html","faq":"faq.html",
        "track":"track.html","halal":"halal.html","admin":"admin.html"
      };
      var marker="/mejavi-skin/";
      var path=location.pathname;
      var index=path.indexOf(marker);
      var key=(index>=0?path.slice(index+marker.length):path.replace(/^\//,"")).replace(/\/$/,"");
      if(routes[key]){
        location.replace(marker+routes[key]+location.search+location.hash);
      }else{
        document.getElementById("message").textContent="Halaman tidak ditemukan.";
      }
    })();
  </script>
</body>
</html>
